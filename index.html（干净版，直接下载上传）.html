<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅览室阅览打卡活动</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
body{background:#f3f4f6;padding:12px;max-width:720px;margin:0 auto;}
.header{background:#1e3a63;color:#fff;padding:24px 16px;border-radius:12px;margin-bottom:16px;}
.header h1{font-size:26px;margin-bottom:8px;}
.header .week{opacity:.85;font-size:15px;}
.tabs{display:flex;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:16px;}
.tab{flex:1;text-align:center;padding:14px 6px;font-size:16px;border:none;background:#fff;cursor:pointer;}
.tab.active{background:#1e3a63;color:#fff;}
.panel{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;}
.hidden{display:none!important;}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:17px;margin:8px 0;cursor:pointer;}
.btn-primary{background:#2563eb;color:#fff;}
.btn-danger{background:#991b1b;color:#fff;}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:8px;margin:8px 0;font-size:16px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;}
.modal-box{background:#fff;width:100%;max-width:420px;border-radius:14px;padding:24px 20px;}
.modal-box h2{text-align:center;margin-bottom:16px;font-size:20px;}
.tip{font-size:14px;color:#444;line-height:1.6;margin:10px 0;}
.rank-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;}
.qr-box{text-align:center;margin:16px 0;}
.qr-box img{width:220px;height:220px;}
</style>
</head>
<body>

<div class="header">
<h1>阅览室阅览打卡</h1>
<div class="week" id="weekText"></div>
</div>

<div class="tabs">
<button class="tab active" data-page="pageCheck">打卡</button>
<button class="tab" data-page="pageRank">周排行榜</button>
<button class="tab" data-page="pageMine">我的</button>
<button class="tab" data-page="pageAdmin">管理员</button>
</div>

<!-- 打卡页 -->
<div id="pageCheck" class="page">
<div class="panel">
<p class="tip">请确保手机开启位置权限，在图书馆阅览室范围内签到打卡。<br>请勿使用微信浏览器打开，会导致定位失效。</p>
<button class="btn btn-primary" id="btnIn">签到进入阅览室</button>
<button class="btn btn-danger hidden" id="btnOut">签离结束阅览</button>
<div class="tip" id="locTip"></div>
</div>
<div class="panel">
<h3>礼品兑换</h3>
<p class="tip">累计阅览时长达到要求可兑换小礼品</p>
<div class="tip" id="giftInfo"></div>
<button class="btn btn-primary" id="btnExchange">申请兑换礼品</button>
</div>
</div>

<!-- 排行榜页 -->
<div id="pageRank" class="page hidden">
<div class="panel">
<h3>本周阅览时长排行榜</h3>
<div id="rankList"></div>
</div>
</div>

<!-- 我的页 -->
<div id="pageMine" class="page hidden">
<div class="panel">
<h3>我的阅览信息</h3>
<p>姓名：<span id="myName">-</span></p>
<p>学号：<span id="mySid">-</span></p>
<p>累计总时长(分钟)：<span id="myTotal">0</span></p>
<p>本周时长(分钟)：<span id="myWeek">0</span></p>
<div id="myRecords" style="margin-top:12px;"></div>
</div>
</div>

<!-- 管理员页 -->
<div id="pageAdmin" class="page hidden">
<div class="panel">
<h3>管理员登录</h3>
<input type="password" id="adminPwd" placeholder="输入管理员密码">
<button class="btn btn-primary" id="btnAdminLogin">登录管理员后台</button>
<div id="adminPanel" class="hidden">
<hr style="margin:16px 0;">
<h4>打卡二维码</h4>
<p class="tip">截图下方二维码，打印张贴阅览室；学生扫码参与打卡。<br>提醒学生：不要微信扫码，请使用手机浏览器打开。</p>
<div class="qr-box"><img id="qrImg" alt="打卡二维码"></div>
<button class="btn btn-primary" id="btnExport">导出全部打卡记录</button>
<button class="btn btn-danger" id="btnClear">清空全部测试数据</button>
</div>
</div>
</div>

<!-- 学生信息弹窗 -->
<div id="stuModal" class="modal hidden">
<div class="modal-box">
<h2>填写读者信息</h2>
<input type="text" id="inpName" placeholder="请输入姓名">
<input type="text" id="inpSid" placeholder="请输入学号">
<button class="btn btn-primary" id="btnSaveStu">确认进入打卡系统</button>
</div>
</div>

<script>
// ===== 配置区 =====
var CFG = {
  adminKey: "lib2026read",
  libLat: 36.6173,
  libLon: 101.7782,
  radius: 80,
  giftMin: 180,
  giftName: "阅览室纪念小礼品"
};

var appData = JSON.parse(localStorage.getItem("readData")) || {records: [], exchanges: []};
var curStu = JSON.parse(localStorage.getItem("curStu")) || null;
var inTime = localStorage.getItem("inTime") ? new Date(localStorage.getItem("inTime")) : null;
var watchId = null;

// 本周日期
function getWeekRange() {
  var d = new Date();
  var day = d.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  var mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  mon.setHours(0,0,0,0);
  var sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return mon.getFullYear() + "/" + (mon.getMonth()+1) + "/" + mon.getDate() + " 周一 - " + (sun.getMonth()+1) + "/" + sun.getDate() + " 周日";
}
document.getElementById("weekText").innerText = "本周：" + getWeekRange();

// 标签切换
var tabs = document.querySelectorAll(".tab");
for (var i = 0; i < tabs.length; i++) {
  tabs[i].onclick = function() {
    for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove("active");
    this.classList.add("active");
    var pages = document.querySelectorAll(".page");
    for (var k = 0; k < pages.length; k++) pages[k].classList.add("hidden");
    document.getElementById(this.dataset.page).classList.remove("hidden");
    renderAll();
  };
}

// 距离计算（Haversine）
function getDistance(lat1, lon1, lat2, lon2) {
  var R = 6371000;
  var rad = Math.PI / 180;
  var p1 = lat1 * rad, p2 = lat2 * rad;
  var dp = (lat2 - lat1) * rad;
  var dl = (lon2 - lon1) * rad;
  var a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 定位监听
function startWatch() {
  if (!navigator.geolocation) {
    document.getElementById("locTip").innerText = "浏览器不支持定位，请更换系统浏览器";
    return;
  }
  if (watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(function(pos) {
    var lat = pos.coords.latitude;
    var lon = pos.coords.longitude;
    var dist = getDistance(lat, lon, CFG.libLat, CFG.libLon);
    document.getElementById("locTip").innerText = "当前距离图书馆：" + dist.toFixed(1) + "米，有效范围" + CFG.radius + "米";
    if (inTime && dist > CFG.radius) doSignOut();
  }, function() {
    document.getElementById("locTip").innerText = "定位获取失败，请打开手机位置权限";
  }, {enableHighAccuracy: true, maximumAge: 0, timeout: 8000});
}

// 单次定位
function getPosOnce() {
  return new Promise(function(resolve) {
    navigator.geolocation.getCurrentPosition(function(p){resolve(p);}, function(){resolve(null);}, {enableHighAccuracy:true});
  });
}

// 签到
document.getElementById("btnIn").onclick = async function() {
  if (!curStu) { alert("请先填写读者信息"); return; }
  var pos = await getPosOnce();
  if (!pos) { alert("获取位置失败"); return; }
  var d = getDistance(pos.coords.latitude, pos.coords.longitude, CFG.libLat, CFG.libLon);
  if (d > CFG.radius) { alert("不在阅览室有效范围内，当前距离" + d.toFixed(1) + "米，不能签到"); return; }
  inTime = new Date();
  localStorage.setItem("inTime", inTime.toISOString());
  toggleBtn(true);
};

// 签离
document.getElementById("btnOut").onclick = function() { doSignOut(); };

function doSignOut() {
  if (!inTime || !curStu) return;
  var end = new Date();
  var dur = Math.round((end.getTime() - inTime.getTime()) / 60000);
  if (dur >= 1) {
    appData.records.push({
      name: curStu.name, sid: curStu.sid,
      inTime: inTime.toISOString(), outTime: end.toISOString(),
      duration: dur
    });
    save();
  }
  inTime = null;
  localStorage.removeItem("inTime");
  toggleBtn(false);
  renderAll();
}

function toggleBtn(isIn) {
  if (isIn) {
    document.getElementById("btnIn").classList.add("hidden");
    document.getElementById("btnOut").classList.remove("hidden");
  } else {
    document.getElementById("btnIn").classList.remove("hidden");
    document.getElementById("btnOut").classList.add("hidden");
  }
}

function save() {
  localStorage.setItem("readData", JSON.stringify(appData));
}

// 学生信息保存
document.getElementById("btnSaveStu").onclick = function() {
  var name = document.getElementById("inpName").value.trim();
  var sid = document.getElementById("inpSid").value.trim();
  if (!name || !sid) { alert("姓名和学号不能为空"); return; }
  curStu = {name: name, sid: sid};
  localStorage.setItem("curStu", JSON.stringify(curStu));
  document.getElementById("stuModal").classList.add("hidden");
  startWatch();
  renderAll();
};

// 管理员登录
document.getElementById("btnAdminLogin").onclick = function() {
  var p = document.getElementById("adminPwd").value.trim();
  if (p === CFG.adminKey) {
    document.getElementById("adminPanel").classList.remove("hidden");
    var url = encodeURIComponent(window.location.href);
    document.getElementById("qrImg").src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + url;
    alert("管理员登录成功");
  } else {
    alert("密码错误");
  }
};

// 导出CSV
document.getElementById("btnExport").onclick = function() {
  var text = "姓名,学号,签到时间,签离时间,时长(分钟)\n";
  for (var i = 0; i < appData.records.length; i++) {
    var r = appData.records[i];
    text += r.name + "," + r.sid + "," + r.inTime + "," + r.outTime + "," + r.duration + "\n";
  }
  var blob = new Blob([text], {type: "text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "阅览室打卡记录.csv";
  a.click();
};

// 清空数据
document.getElementById("btnClear").onclick = function() {
  if (confirm("确认清空全部打卡测试数据？不可恢复！")) {
    localStorage.removeItem("readData");
    localStorage.removeItem("curStu");
    localStorage.removeItem("inTime");
    appData = {records: [], exchanges: []};
    curStu = null;
    inTime = null;
    alert("数据已清空，页面将刷新");
    location.reload();
  }
};

// 礼品兑换
document.getElementById("btnExchange").onclick = function() {
  if (!curStu) return;
  var total = getStuTotal(curStu.sid);
  if (total >= CFG.giftMin) {
    appData.exchanges.push({sid: curStu.sid, name: curStu.name, time: new Date().toISOString(), gift: CFG.giftName});
    save();
    alert("恭喜！累计" + total + "分钟，已登记申请【" + CFG.giftName + "】，请到阅览室前台领取");
  } else {
    alert("累计阅览时长" + total + "分钟，还需要" + (CFG.giftMin - total) + "分钟才可兑换礼品");
  }
};

function getStuTotal(sid) {
  var sum = 0;
  for (var i = 0; i < appData.records.length; i++) {
    if (appData.records[i].sid === sid) sum += appData.records[i].duration;
  }
  return sum;
}

function getStuWeek(sid) {
  var now = new Date();
  var day = now.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  var mon = new Date(now);
  mon.setDate(now.getDate() + diff);
  mon.setHours(0,0,0,0);
  var sum = 0;
  for (var i = 0; i < appData.records.length; i++) {
    var r = appData.records[i];
    if (r.sid === sid && new Date(r.inTime) >= mon) sum += r.duration;
  }
  return sum;
}

// 渲染全部
function renderAll() {
  if (!curStu) return;
  document.getElementById("myName").innerText = curStu.name;
  document.getElementById("mySid").innerText = curStu.sid;
  document.getElementById("myTotal").innerText = getStuTotal(curStu.sid);
  document.getElementById("myWeek").innerText = getStuWeek(curStu.sid);
  document.getElementById("giftInfo").innerText = "兑换条件：累计阅览" + CFG.giftMin + "分钟，礼品：" + CFG.giftName;
  toggleBtn(!!inTime);

  // 我的记录
  var myRecs = [];
  for (var i = 0; i < appData.records.length; i++) {
    if (appData.records[i].sid === curStu.sid) myRecs.push(appData.records[i]);
  }
  myRecs.reverse();
  var html = "";
  for (var j = 0; j < myRecs.length; j++) {
    var r = myRecs[j];
    var t = new Date(r.inTime);
    html += '<div class="rank-item"><span>' + (t.getMonth()+1) + '/' + t.getDate() + ' ' + t.getHours() + ':' + (t.getMinutes()<10?'0':'') + t.getMinutes() + '</span><span>' + r.duration + '分钟</span></div>';
  }
  document.getElementById("myRecords").innerHTML = html || '<p class="tip">暂无打卡记录</p>';

  // 排行榜（按本周）
  var map = {};
  for (var k = 0; k < appData.records.length; k++) {
    var rec = appData.records[k];
    if (!map[rec.sid]) map[rec.sid] = {name: rec.name, week: 0};
    var now2 = new Date();
    var day2 = now2.getDay();
    var diff2 = day2 === 0 ? -6 : 1 - day2;
    var mon2 = new Date(now2);
    mon2.setDate(now2.getDate() + diff2);
    mon2.setHours(0,0,0,0);
    if (new Date(rec.inTime) >= mon2) map[rec.sid].week += rec.duration;
  }
  var arr = [];
  for (var key in map) arr.push(map[key]);
  arr.sort(function(a, b) { return b.week - a.week; });
  var rankHtml = "";
  for (var m = 0; m < arr.length; m++) {
    rankHtml += '<div class="rank-item"><span>' + (m+1) + '. ' + arr[m].name + '</span><span>' + arr[m].week + '分钟</span></div>';
  }
  document.getElementById("rankList").innerHTML = rankHtml || '<p class="tip">暂无打卡数据</p>';
}

// 初始化
if (!curStu) {
  document.getElementById("stuModal").classList.remove("hidden");
} else {
  startWatch();
  renderAll();
}
</script>
</body>
</html>
