<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅览室阅览打卡活动</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:#f5f7fa;color:#222;padding:12px;max-width:720px;margin:0 auto}
.header{background:#2b7bcc;color:#fff;padding:16px;border-radius:10px;margin-bottom:12px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #00000018}
.time-display{font-size:42px;font-weight:bold;text-align:center;margin:20px 0}
.btn{width:100%;padding:14px;font-size:17px;border:none;border-radius:8px;margin:6px 0}
.btn-start{background:#2b7bcc;color:#fff}
.btn-stop{background:#d63031;color:#fff}
.btn-admin{background:#27ae60;color:#fff}
.btn:disabled{background:#bbbbbb;color:#666}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-item{text-align:center;padding:14px;background:#f0f4f9;border-radius:8px}
.rank-item{padding:10px;border-bottom:1px solid #eee}
.tab-bar{display:flex;margin-top:10px}
.tab{flex:1;text-align:center;padding:12px;background:#e9edf4}
.tab.active{background:#2b7bcc;color:white}
.page{display:none}
.page.active{display:block}
.tip{color:#c0392b;font-size:14px;margin:8px 0}
.green{color:#008736}
.grey{color:#777}
.input-text{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<div class="header">
<h2>📖阅览室阅览打卡</h2>
<div id="weekInfo"></div>
</div>
<div class="tab-bar">
<div class="tab active" onclick="switchTab('tabCheckin')">打卡</div>
<div class="tab" onclick="switchTab('tabRank')">周排行榜</div>
<div class="tab" onclick="switchTab('tabMine')">我的</div>
<div class="tab" onclick="switchTab('tabAdmin')">管理员</div>
</div>

<div id="tabCheckin" class="page active">
<div class="card">
<div id="areaTip" class="tip"></div>
<div class="time-display" id="timerText">00:00:00</div>
<button class="btn btn-start" id="btnStart" onclick="startCheckin()">开始阅览计时</button>
<button class="btn btn-stop" id="btnStop" onclick="stopCheckin()" disabled>结束阅览计时</button>
</div>
<div class="card stat-row">
<div class="stat-item">
<div>本周时长</div>
<div id="weekHour" style="font-size:22px">0h</div>
</div>
<div class="stat-item">
<div>总累计时长</div>
<div id="totalHour" style="font-size:22px">0h</div>
</div>
</div>
<div class="card">
<h4>活动规则</h4>
<p style="font-size:14px;line-height:1.7">
1.必须在图书馆阅览室40米范围内才可开启计时；离开范围自动暂停计时。<br>
2.统计周期：周一00:00‑周日24:00；单周累计＞3小时进入本周排行榜。<br>
3.按本周时长从高到低排名，每周达标可参与奖品兑换，不限次数。
</p>
</div>
</div>

<div id="tabRank" class="page">
<div class="card">
<h3>📊本周排行榜（仅>3小时有效上榜）</h3>
<div id="rankList"></div>
</div>
</div>

<div id="tabMine" class="page">
<div class="card">
<h3>我的阅览记录</h3>
<p>打卡总天数：<span id="dayCount">0</span></p>
<p>总累计小时：<span id="myTotal">0</span></p>
<p>本周小时：<span id="myWeek">0</span></p>
<p id="weekValidTip"></p>
<button class="btn" onclick="exportData()">导出本机记录文本</button>
</div>
</div>

<div id="tabAdmin" class="page">
<div class="card">
<h3>管理员面板</h3>
<div id="adminLockArea">
<p>请输入管理员访问密钥解锁管理功能</p>
<input class="input-text" id="adminKeyInput" type="password" placeholder="输入密钥，内容不会明文显示">
<button class="btn btn-admin" onclick="adminUnlock()">解锁管理面板</button>
</div>
<div id="adminContent" style="display:none;">
<p>✅管理员已解锁</p>
<p>本机全部打卡记录总条数：<span id="adminRecordCount">0</span></p>
<p>本机全部累计总时长：<span id="adminTotalTime">0</span></p>
<button class="btn" onclick="adminExportAll()">导出本机全部打卡记录</button>
<button class="btn" onclick="adminLock()">锁定管理面板</button>
</div>
</div>
</div>

<script>
// =========【固化参数】=========
const CONFIG = {
  libLat: 36.600556,
  libLng: 101.757222,
  radiusMeter: 40,
  weekMinHour:3
};
// 👉在这里修改管理员密钥，网页界面永远不会展示这个字符串
const ADMIN_KEY = "lib2026read";

// Haversine 计算两点距离米
function getDistance(lat1,lng1,lat2,lng2){
  const R=6371000;
  const rad=Math.PI/180;
  const φ1=lat1*rad,φ2=lat2*rad;
  const Δφ=(lat2-lat1)*rad;
  const Δλ=(lng2-lng1)*rad;
  const a=Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// 获取当前属于哪一周（周一为一周起点）返回 {start,end,key}
function getWeekInfo(d=new Date()){
  const date=new Date(d);
  const day=date.getDay();
  const diff=(day===0?-6:1-day);
  const monday=new Date(date);
  monday.setDate(date.getDate()+diff);
  monday.setHours(0,0,0,0);
  const sunday=new Date(monday);
  sunday.setDate(monday.getDate()+6);
  sunday.setHours(23,59,59,999);
  const key=monday.toLocaleDateString();
  return {start:monday, end:sunday, key};
}

// 本地存储读写
const STORAGE_KEY="readCheckinData";
function loadData(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw) return {records:[],isRunning:false,runningStart:null,totalMs:0};
  return JSON.parse(raw);
}
function saveData(d){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
}

let appData=loadData();
let timer=null;
let currentPosition=null;
let adminUnlocked=false;

// UI刷新
function renderUI(){
  const wi=getWeekInfo();
  document.getElementById("weekInfo").innerText=`本周：${wi.key} 周一‑周日`;

  if(appData.isRunning&&appData.runningStart){
    const now=Date.now();
    const elapsed=now-appData.runningStart;
    setTimerText(elapsed);
  }else{
    setTimerText(0);
  }

  document.getElementById("btnStart").disabled=appData.isRunning;
  document.getElementById("btnStop").disabled=!appData.isRunning;

  const {weekMs,totalMs,dayCnt}=calcStat();
  const weekH=(weekMs/(1000*3600)).toFixed(2);
  const totalH=(totalMs/(1000*3600)).toFixed(2);

  document.getElementById("weekHour").innerText=weekH+" h";
  document.getElementById("totalHour").innerText=totalH+" h";
  document.getElementById("dayCount").innerText=dayCnt;
  document.getElementById("myTotal").innerText=totalH+" 小时";
  document.getElementById("myWeek").innerText=weekH+" 小时";

  const valid=parseFloat(weekH)>CONFIG.weekMinHour;
  document.getElementById("weekValidTip").innerText=valid
    ?`<span class="green">✅本周超过3小时，可参与奖品兑换</span>`
    :`<span class="grey">⚠️本周不足3小时，不参与本周排名</span>`;

  renderRank();
  renderAdminPanel();
}

function setTimerText(ms){
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  document.getElementById("timerText").innerText
    =String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

// 统计计算
function calcStat(){
  const wi=getWeekInfo();
  let weekMs=0,totalMs=0;
  const daySet=new Set();
  appData.records.forEach(r=>{
    const t=new Date(r.endTime);
    totalMs+=r.durationMs||0;
    if(t>=wi.start&&t<=wi.end){
      weekMs+=r.durationMs||0;
    }
    const dStr=t.toLocaleDateString();
    daySet.add(dStr);
  });
  return {weekMs,totalMs,dayCnt:daySet.size};
}

// 渲染排行榜（本机仅自己数据；多用户需要后端）
function renderRank(){
  const box=document.getElementById("rankList");
  const {weekMs}=calcStat();
  const wh=weekMs/(1000*3600);
  if(wh>CONFIG.weekMinHour){
    box.innerHTML=`<div class="rank-item">🏆你：${wh.toFixed(2)} 小时（达标上榜）</div>`;
  }else{
    box.innerHTML=`<div class="rank-item grey">本周时长不足3小时，未上榜</div>`;
  }
}

// 管理员面板渲染
function renderAdminPanel(){
  if(!adminUnlocked){
    document.getElementById("adminLockArea").style.display="block";
    document.getElementById("adminContent").style.display="none";
  }else{
    document.getElementById("adminLockArea").style.display="none";
    document.getElementById("adminContent").style.display="block";
    document.getElementById("adminRecordCount").innerText=appData.records.length;
    const totalH=(calcStat().totalMs/(1000*3600)).toFixed(2);
    document.getElementById("adminTotalTime").innerText=totalH+" 小时";
  }
}

// 管理员解锁校验
function adminUnlock(){
  const inputVal=document.getElementById("adminKeyInput").value.trim();
  if(inputVal === ADMIN_KEY){
    adminUnlocked=true;
    document.getElementById("adminKeyInput").value="";
    renderAdminPanel();
  }else{
    alert("密钥错误");
    document.getElementById("adminKeyInput").value="";
  }
}
function adminLock(){
  adminUnlocked=false;
  renderAdminPanel();
}
function adminExportAll(){
  const txt=JSON.stringify(appData,null,2);
  const blob=new Blob([txt],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="管理员_全部打卡记录.txt";
  a.click();
}

// 定位循环监听
function watchPosition(){
  if(!navigator.geolocation){
    document.getElementById("areaTip").innerText="⚠️浏览器不支持定位，请更换手机系统浏览器";
    return;
  }
  navigator.geolocation.watchPosition(
    pos=>{
      currentPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};
      const dist=getDistance(currentPosition.lat,currentPosition.lng,CONFIG.libLat,CONFIG.libLng);
      if(dist<=CONFIG.radiusMeter){
        document.getElementById("areaTip").innerHTML="✅已在阅览室围栏内，可以开始计时";
      }else{
        document.getElementById("areaTip").innerHTML=`⚠️离开阅览区域(${Math.round(dist)}米)，计时将自动暂停`;
        if(appData.isRunning){
          stopCheckin();
        }
      }
    },
    err=>{
      document.getElementById("areaTip").innerText="❌获取位置失败，请开启GPS并允许位置权限";
    },
    {enableHighAccuracy:true,maximumAge:2000,timeout:8000}
  );
}

// 开始计时
function startCheckin(){
  if(!currentPosition){alert("正在获取位置，请稍候");return;}
  const dist=getDistance(currentPosition.lat,currentPosition.lng,CONFIG.libLat,CONFIG.libLng);
  if(dist>CONFIG.radiusMeter){
    alert("不在阅览室40米范围内，不能开启计时");
    return;
  }
  appData.isRunning=true;
  appData.runningStart=Date.now();
  saveData(appData);
  startTimerTick();
  renderUI();
}

function stopCheckin(){
  if(!appData.isRunning) return;
  const end=Date.now();
  const dur=end-appData.runningStart;
  appData.records.push({
    startTime:appData.runningStart,
    endTime:end,
    durationMs:dur
  });
  appData.isRunning=false;
  appData.runningStart=null;
  saveData(appData);
  stopTimerTick();
  renderUI();
}

function startTimerTick(){
  stopTimerTick();
  timer=setInterval(()=>{
    if(appData.isRunning&&appData.runningStart){
      setTimerText(Date.now()-appData.runningStart);
    }
  },1000);
}
function stopTimerTick(){
  if(timer){clearInterval(timer);timer=null;}
}

// tab切换
function switchTab(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  event.target.classList.add("active");
}

function exportData(){
  const txt=JSON.stringify(appData,null,2);
  const blob=new Blob([txt],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="阅览打卡记录.txt";
  a.click();
}

// 初始化
watchPosition();
renderUI();
if(appData.isRunning) startTimerTick();
</script>
</body>
</html>
