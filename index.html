<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅览室阅览打卡活动</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#f4f6f8;padding:16px;color:#222;}
.header{background:#23396b;color:#fff;padding:32px 20px;border-radius:16px;margin-bottom:16px;}
.header h1{font-size:36px;margin-bottom:8px;}
.tabs{display:flex;margin-bottom:16px;}
.tab{flex:1;padding:16px 8px;text-align:center;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:18px;}
.tab.active{background:#23396b;color:#fff;}
.panel{display:none;background:#fff;padding:24px;border-radius:16px;margin-bottom:16px;}
.panel.show{display:block;}
.tip{color:#444;margin-bottom:20px;line-height:1.6;font-size:17px;}
.warn{color:#d97706;font-weight:bold;}
.btn{width:100%;padding:18px;font-size:20px;border:none;border-radius:12px;background:#3b63e8;color:#fff;margin:8px 0;cursor:pointer;}
.btn-red{background:#c23b3b;}
.input-item{width:100%;padding:14px;font-size:17px;border:1px solid #bbb;border-radius:8px;margin:10px 0;}
.box{background:#fff;padding:20px;border-radius:14px;margin:12px 0;}
.qrcode-img{max-width:260px;margin:12px auto;display:block;border:1px solid #ddd;}
.popup-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;}
.popup{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:420px;}
.item-row{padding:10px 0;border-bottom:1px solid #eee;}
/*新增实时计时样式*/
.time-box{background:#23396b;color:#ffffff;text-align:center;padding:16px;border-radius:12px;margin:12px 0;display:none;}
.time-text{font-size:32px;font-weight:bold;letter‑spacing:2px;}
.time-desc{font-size:15px;margin-top:4px;opacity:0.9;}
</style>
</head>
<body>
<div class="header">
<h1>📖阅览室阅览打卡</h1>
<div id="weekText"></div>
</div>
<div class="tabs">
<div class="tab active" data-tab="tab-check">打卡</div>
<div class="tab" data-tab="tab-rank">周排行榜</div>
<div class="tab" data-tab="tab-mine">我的</div>
<div class="tab" data-tab="tab-admin">管理员</div>
</div>
<div id="tab-check" class="panel show">
<div class="tip">请确保手机开启位置权限，在图书馆阅览室范围内签到打卡。<br><span class="warn">⚠️请勿使用微信浏览器打开，会导致定位失效。强烈建议连接馆内WiFi提升定位精度。有效打卡范围40米。<br>规则：单次停留不少于30分钟计有效；每周累计有效时长≥3小时参与排行榜。页面保持前台打开，离开阅览室范围会自动签退；锁屏/切后台无法自动检测，请务必手动签退。</span></div>

<!--新增实时计时模块-->
<div class="time-box" id="timeBox">
<div class="time-text" id="timeShow">00:00:00</div>
<div class="time-desc">当前阅览时长</div>
</div>

<button class="btn" id="btnCheckIn">签到进入阅览室</button>
<button class="btn btn-red" id="btnCheckOut" style="display:none;">签退离开阅览室</button>
<div id="readingTip" style="margin:12px 0;font-size:17px;color:#222;"></div>
<div class="box">
<h3>🎁礼品兑换</h3>
<p style="margin:10px 0;color:#444">累计阅览时长达到要求可兑换小礼品</p>
<button class="btn" id="btnGift">申请兑换礼品</button>
</div>
</div>
<div id="tab-rank" class="panel">
<h3>本周排行榜（有效时长≥3小时上榜）</h3>
<div id="rankList"></div>
</div>
<div id="tab-mine" class="panel">
<h3>我的打卡信息</h3>
<div id="myInfo"></div>
</div>
<div id="tab-admin" class="panel">
<div id="adminLoginArea">
<h3>管理员登录</h3>
<input class="input-item" id="adminPwd" placeholder="输入管理员密钥">
<button class="btn" id="btnAdminLogin">登录管理员</button>
</div>
<div id="adminWorkArea" style="display:none;">
<h3>管理员操作面板</h3>
<button class="btn" id="btnGenQr">生成打卡二维码</button>
<div id="qrWrap"></div>
<div class="box">
<h4>本周打卡记录</h4>
<div id="adminRecordWrap"></div>
<button class="btn" id="exportText">导出文本记录</button>
</div>
</div>
</div>
<!--读者信息弹窗-->
<div id="userPopup" class="popup-mask">
<div class="popup">
<h3>读者信息登记</h3>
<input class="input-item" id="stuName" placeholder="请输入姓名">
<input class="input-item" id="stuId" placeholder="请输入证件号/学号">
<button class="btn" id="saveUser">保存信息</button>
</div>
</div>
<script>
const ADMIN_KEY = "lib2026read";
//阅览室指南针读取真实经纬度
const TARGET_LAT = 36.60056;
const TARGET_LNG = 101.75722;
const ALLOW_RADIUS = 40;
const MIN_SINGLE_MINUTE = 30;
const WEEK_REQUIRE_MINUTE = 180;

let watchId = null; //位置监听句柄
let outOfRangeCount = 0; //连续超出围栏计数
let timerInterval = null; //计时定时器

let userInfo = JSON.parse(localStorage.getItem("readerUser")) || null;
let checkinState = JSON.parse(localStorage.getItem("checkinState")) || null;
let allRecords = JSON.parse(localStorage.getItem("checkRecords")) || [];
const popupDom = document.getElementById("userPopup");
const timeBox = document.getElementById("timeBox");
const timeShow = document.getElementById("timeShow");

//====自动计算本周：周一为一周起始，周日结束====
function getWeekRangeText(){
    const now = new Date();
    const day = now.getDay();
    // getDay:0=周日,1周一...6周六
    const monday = new Date(now);
    const offsetMon = day===0 ? -6 : 1-day;
    monday.setDate(now.getDate()+offsetMon);

    const sunday = new Date(monday);
    sunday.setDate(monday.getDate()+6);

    const fmt = (d)=> `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
    return `本周：${fmt(monday)} 周一---${fmt(sunday)}周日`;
}
document.getElementById("weekText").innerText = getWeekRangeText();

//格式化秒数为时:分:秒
function formatHMS(totalSec){
    let h = Math.floor(totalSec / 3600);
    let m = Math.floor((totalSec % 3600)/60);
    let s = Math.floor(totalSec % 60);
    return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}

//开启实时计时
function startTimer(){
    stopTimer();
    if(!checkinState) return;
    timeBox.style.display="block";
    timerInterval = setInterval(()=>{
        let sec = Math.floor((Date.now() - checkinState.checkinTime)/1000);
        timeShow.innerText = formatHMS(sec);
    },1000);
}

//关闭计时
function stopTimer(){
    if(timerInterval){
        clearInterval(timerInterval);
        timerInterval=null;
    }
    timeBox.style.display="none";
    timeShow.innerText="00:00:00";
}

if(!userInfo){
popupDom.style.display="flex";
}else{
popupDom.style.display="none";
}

//停止位置监听
function stopWatchLocation(){
    if(watchId !== null){
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }
    outOfRangeCount = 0;
}

//开启实时位置监听，用于离开范围自动签退
function startWatchLocation(){
    stopWatchLocation();
    watchId = navigator.geolocation.watchPosition(
        function(pos){
            let currLat = pos.coords.latitude;
            let currLng = pos.coords.longitude;
            let dist = getDistance(currLat,currLng,TARGET_LAT,TARGET_LNG);
            if(dist > ALLOW_RADIUS){
                outOfRangeCount +=1;
                //连续2次判定超出范围，执行自动签退
                if(outOfRangeCount >=2 && checkinState){
                    alert("检测到已离开阅览室范围，系统自动签退");
                    doCheckOut();
                }
            }else{
                outOfRangeCount = 0;
            }
        },
        function(err){
            //定位出错不弹窗，静默，等待手动签退
        },
        {enableHighAccuracy:true,timeout:15000,maximumAge:8000}
    );
}

//执行签退逻辑，抽成公共函数，手动、自动签退共用
function doCheckOut(){
    if(!checkinState) return;
    let checkinMs = checkinState.checkinTime;
    let checkoutMs = Date.now();
    let totalMin = Math.round((checkoutMs - checkinMs)/1000/60);
    let validMin = totalMin >= MIN_SINGLE_MINUTE ? totalMin : 0;
    let rec = {
        name:userInfo.name,
        sid:userInfo.sid,
        checkin:checkinMs,
        checkout:checkoutMs,
        totalMin:totalMin,
        validMin:validMin,
        isValid: validMin>0
    };
    allRecords.push(rec);
    localStorage.setItem("checkRecords",JSON.stringify(allRecords));

    checkinState=null;
    localStorage.removeItem("checkinState");
    stopWatchLocation();
    stopTimer();

    document.getElementById("btnCheckIn").style.display="block";
    document.getElementById("btnCheckOut").style.display="none";
    document.getElementById("readingTip").innerText="";

    renderMine();renderRank();renderAdminRecord();
}

document.getElementById("saveUser").onclick=function(){
let name = document.getElementById("stuName").value.trim();
let sid = document.getElementById("stuId").value.trim();
if(!name || !sid){
alert("请填写姓名和证件号");
return;
}
userInfo = {name:name, sid:sid};
localStorage.setItem("readerUser",JSON.stringify(userInfo));
popupDom.style.display="none";
alert("读者信息保存完成");
renderMine();
}

document.querySelectorAll(".tab").forEach(tab=>{
tab.onclick=function(){
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
this.classList.add("active");
let tid=this.getAttribute("data-tab");
document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
document.getElementById(tid).classList.add("show");
renderMine();renderRank();renderAdminRecord();
}
});

document.getElementById("btnAdminLogin").onclick=function(){
let p=document.getElementById("adminPwd").value.trim();
if(p===ADMIN_KEY){
document.getElementById("adminLoginArea").style.display="none";
document.getElementById("adminWorkArea").style.display="block";
alert("管理员登录成功");
renderAdminRecord();
}else{
alert("密钥错误");
}
}

document.getElementById("btnGenQr").onclick=function(){
let url=window.location.href;
let qrImg=document.createElement("img");
qrImg.className="qrcode-img";
qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(url);
document.getElementById("qrWrap").innerHTML="";
document.getElementById("qrWrap").appendChild(qrImg);
}

function getDistance(lat1,lng1,lat2,lng2){
let radLat1 = Math.PI*lat1/180;
let radLat2 = Math.PI*lat2/180;
let deltaLat = radLat1-radLat2;
let deltaLng = Math.PI*(lng1-lng2)/180;
let s = 2*Math.asin(Math.sqrt(Math.pow(Math.sin(deltaLat/2),2)+Math.cos(radLat1)*Math.cos(radLat2)*Math.pow(Math.sin(deltaLng/2),2)));
return s*6371000;
}

document.getElementById("btnCheckIn").onclick=function(){
if(!userInfo){
popupDom.style.display="flex";
alert("请先登记读者姓名与证件号");
return;
}
if(checkinState){
alert("您已经签到，请先签退！");
return;
}
if(!navigator.geolocation){
alert("你的浏览器不支持定位，请更换浏览器");
return;
}
let btn = this;
btn.disabled=true;
btn.innerText="正在获取位置，请稍候...";
navigator.geolocation.getCurrentPosition(
function(pos){
btn.disabled=false;
btn.innerText="签到进入阅览室";
let currLat = pos.coords.latitude;
let currLng = pos.coords.longitude;
let accuracy = pos.coords.accuracy;
let dist = getDistance(currLat,currLng,TARGET_LAT,TARGET_LNG);
let msg = `当前位置精度：${accuracy.toFixed(1)}米\n距离阅览室：${dist.toFixed(0)}米`;
if(dist <= ALLOW_RADIUS){
alert(msg + "\n✅位置校验通过，签到成功！\n姓名："+userInfo.name+"\n证件号："+userInfo.sid);
checkinState = {checkinTime:Date.now(),lat:currLat,lng:currLng};
localStorage.setItem("checkinState",JSON.stringify(checkinState));
document.getElementById("btnCheckIn").style.display="none";
document.getElementById("btnCheckOut").style.display="block";
document.getElementById("readingTip").innerText="⏱正在阅览计时中，请离开时点击签退；页面保持前台，离开范围会自动签退";
startWatchLocation();
startTimer(); //签到成功启动秒表
}else{
alert(msg + "\n❌超出40米有效打卡范围，签到无效！请移步阅览室，建议连接馆内WiFi！");
}
},
function(err){
btn.disabled=false;
btn.innerText="签到进入阅览室";
let errMsg;
switch(err.code){
case 1: errMsg="定位被拒绝，请在浏览器设置允许该网站位置权限！";break;
case 2: errMsg="无法获取位置信号，室内务必连接阅览室WiFi";break;
case 3: errMsg="定位超时，请重试";break;
default:errMsg="定位异常";
}
alert(errMsg);
},
{enableHighAccuracy:true,timeout:12000,maximumAge:0}
);
}

document.getElementById("btnCheckOut").onclick=function(){
    doCheckOut();
    let checkinMs = checkinState?.checkinTime||0;
    let totalMin = Math.round((Date.now() - checkinMs)/1000/60);
    let tipMsg = totalMin >= MIN_SINGLE_MINUTE
    ? `✅本次阅览${totalMin}分钟，达到最低30分钟，计入有效时长`
    : `❌本次阅览${totalMin}分钟，不足30分钟，不计入有效时长`;
    alert(tipMsg);
}

function renderMine(){
if(!userInfo) return;
let html=`<p>姓名：${userInfo.name}</p><p>学号/证件号：${userInfo.sid}</p>`;
let weekRec = getWeekRecords(allRecords);
let weekValid = weekRec.reduce((sum,r)=>sum+r.validMin,0);
html+=`<p>📅本周累计有效阅览：${weekValid}分钟（要求≥${WEEK_REQUIRE_MINUTE}分钟）</p>`;
document.getElementById("myInfo").innerHTML=html;
}

function getWeekRecords(list){
let now=new Date();
let day=now.getDay();
let monday=new Date();
monday.setDate(now.getDate()-(day===0?6:day-1));
monday.setHours(0,0,0,0);
let mondayTs=monday.getTime();
return list.filter(r=>r.checkin >= mondayTs);
}

function renderRank(){
let weekRec = getWeekRecords(allRecords);
let map={};
weekRec.forEach(r=>{
let key=r.name+"_"+r.sid;
if(!map[key]) map[key]={name:r.name,sid:r.sid,sumValid:0};
map[key].sumValid+=r.validMin;
});
let arr=Object.values(map).filter(x=>x.sumValid >= WEEK_REQUIRE_MINUTE);
arr.sort((a,b)=>b.sumValid - a.sumValid);
let html="";
if(arr.length===0){
html="<p>暂无满足条件上榜人员（需本周有效≥180分钟）</p>";
}else{
arr.forEach((item,idx)=>{
html+=`<div class="item-row">${idx+1}. ${item.name}｜证件号${item.sid}｜本周有效${item.sumValid}分钟</div>`;
})
}
document.getElementById("rankList").innerHTML=html;
}

function renderAdminRecord(){
let weekRec = getWeekRecords(allRecords);
let html="";
if(weekRec.length===0){
html="<p>暂无本周打卡记录</p>";
}else{
weekRec.forEach(r=>{
let ci=new Date(r.checkin);
let co=new Date(r.checkout);
html+=`<div class="item-row">${r.name}(${r.sid})｜签到${ci.toLocaleString()}｜签退${co.toLocaleString()}｜总${r.totalMin}分钟｜有效${r.validMin}分钟｜${r.isValid?"有效记录":"无效记录"}</div>`;
})
}
document.getElementById("adminRecordWrap").innerHTML=html;
}

document.getElementById("exportText").onclick=function(){
let weekRec = getWeekRecords(allRecords);
let txt="本周阅览室打卡记录\n";
weekRec.forEach(r=>{
let ci=new Date(r.checkin);
let co=new Date(r.checkout);
txt+=`${r.name},${r.sid},签到:${ci.toLocaleString()},签退:${co.toLocaleString()},总时长:${r.totalMin}分钟,有效时长:${r.validMin}分钟,${r.isValid?"有效":"无效"}\n`;
})
let blob=new Blob([txt],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="阅览室本周打卡记录.txt";
a.click();
}

document.getElementById("btnGift").onclick=function(){
alert("礼品兑换功能");
}

//页面刷新恢复状态
if(checkinState){
document.getElementById("btnCheckIn").style.display="none";
document.getElementById("btnCheckOut").style.display="block";
document.getElementById("readingTip").innerText="⏱正在阅览计时中，请离开时点击签退；页面保持前台，离开范围会自动签退";
startWatchLocation();
startTimer();
}

renderMine();renderRank();
</script>
</body>
</html>
