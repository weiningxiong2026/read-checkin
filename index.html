<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅览室阅览打卡活动</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#f4f6f8;padding:16px;color:#222;}
.header{background:#23396b;color:#fff;padding:32px 20px;border-radius:16px;margin-bottom:16px;}
.header h1{font-size:36px;margin-bottom:8px;}
.tabs{display:flex;margin-bottom:16px;}
.tab{flex:1;padding:16px 8px;text-align:center;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:18px;}
.tab.active{background:#23396b;color:#fff;}
.panel{display:none;background:#fff;padding:24px;border-radius:16px;margin-bottom:16px;}
.panel.show{display:block;}
.tip{color:#444;margin-bottom:20px;line-height:1.6;font-size:17px;}
.warn{color:#d97706;font-weight:bold;}
.btn{width:100%;padding:18px;font-size:20px;border:none;border-radius:12px;background:#3b63e8;color:#fff;margin:8px 0;cursor:pointer;}
.input-item{width:100%;padding:14px;font-size:17px;border:1px solid #bbb;border-radius:8px;margin:10px 0;}
.box{background:#fff;padding:20px;border-radius:14px;margin:12px 0;}
.qrcode-img{max-width:260px;margin:12px auto;display:block;border:1px solid #ddd;}
.popup-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;}
.popup{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:420px;}
</style>
</head>
<body>
<div class="header">
<h1>📖阅览室阅览打卡</h1>
<div id="weekText">本周：2026/8/24 周一---30周日</div>
</div>

<div class="tabs">
<div class="tab active" data-tab="tab-check">打卡</div>
<div class="tab" data-tab="tab-rank">周排行榜</div>
<div class="tab" data-tab="tab-mine">我的</div>
<div class="tab" data-tab="tab-admin">管理员</div>
</div>

<div id="tab-check" class="panel show">
<div class="tip">请确保手机开启位置权限，在图书馆阅览室范围内签到打卡。<br><span class="warn">⚠️请勿使用微信浏览器打开，会导致定位失效。强烈建议连接馆内WiFi提升定位精度。有效打卡范围40米。</span></div>
<button class="btn" id="btnCheckIn">签到进入阅览室</button>
<div class="box">
<h3>🎁礼品兑换</h3>
<p style="margin:10px 0;color:#444">累计阅览时长达到要求可兑换小礼品</p>
<button class="btn" id="btnGift">申请兑换礼品</button>
</div>
</div>

<div id="tab-rank" class="panel">
<h3>周排行榜</h3>
<div id="rankList"></div>
</div>

<div id="tab-mine" class="panel">
<h3>我的打卡信息</h3>
<div id="myInfo"></div>
</div>

<div id="tab-admin" class="panel">
<div id="adminLoginArea">
<h3>管理员登录</h3>
<input class="input-item" id="adminPwd" placeholder="输入管理员密钥">
<button class="btn" id="btnAdminLogin">登录管理员</button>
</div>
<div id="adminWorkArea" style="display:none;">
<h3>管理员操作面板</h3>
<button class="btn" id="btnGenQr">生成打卡二维码</button>
<div id="qrWrap"></div>
</div>
</div>

<!--读者信息弹窗-->
<div id="userPopup" class="popup-mask">
<div class="popup">
<h3>读者信息登记</h3>
<input class="input-item" id="stuName" placeholder="请输入姓名">
<input class="input-item" id="stuId" placeholder="请输入证件号/学号">
<button class="btn" id="saveUser">保存信息</button>
</div>
</div>

<script>
const ADMIN_KEY = "lib2026read";
//阅览室经纬度（取自你的指南针读数）
const TARGET_LAT = 36.60028;
const TARGET_LNG = 101.75694;
const ALLOW_RADIUS = 40; //有效半径40米，超过判定无效

let userInfo = JSON.parse(localStorage.getItem("readerUser")) || null;
const popupDom = document.getElementById("userPopup");

if(!userInfo){
popupDom.style.display="flex";
}else{
popupDom.style.display="none";
}

document.getElementById("saveUser").onclick=function(){
let name = document.getElementById("stuName").value.trim();
let sid = document.getElementById("stuId").value.trim();
if(!name || !sid){
alert("请填写姓名和证件号");
return;
}
userInfo = {name:name, sid:sid};
localStorage.setItem("readerUser",JSON.stringify(userInfo));
popupDom.style.display="none";
alert("读者信息保存完成");
document.getElementById("myInfo").innerHTML = `<p>姓名：${userInfo.name}</p><p>学号/证件号：${userInfo.sid}</p>`;
}

//标签切换
document.querySelectorAll(".tab").forEach(tab=>{
tab.onclick=function(){
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
this.classList.add("active");
let tid=this.getAttribute("data-tab");
document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
document.getElementById(tid).classList.add("show");
}
});

//管理员登录
document.getElementById("btnAdminLogin").onclick=function(){
let p=document.getElementById("adminPwd").value.trim();
if(p===ADMIN_KEY){
document.getElementById("adminLoginArea").style.display="none";
document.getElementById("adminWorkArea").style.display="block";
alert("管理员登录成功");
}else{
alert("密钥错误");
}
}

//生成二维码
document.getElementById("btnGenQr").onclick=function(){
let url=window.location.href;
let qrImg=document.createElement("img");
qrImg.className="qrcode-img";
qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(url);
document.getElementById("qrWrap").innerHTML="";
document.getElementById("qrWrap").appendChild(qrImg);
}

//计算两点距离，返回米
function getDistance(lat1,lng1,lat2,lng2){
let radLat1 = Math.PI*lat1/180;
let radLat2 = Math.PI*lat2/180;
let deltaLat = radLat1-radLat2;
let deltaLng = Math.PI*(lng1-lng2)/180;
let s = 2*Math.asin(Math.sqrt(Math.pow(Math.sin(deltaLat/2),2)+Math.cos(radLat1)*Math.cos(radLat2)*Math.pow(Math.sin(deltaLng/2),2)));
return s*6371000;
}

//签到按钮
document.getElementById("btnCheckIn").onclick=function(){
if(!userInfo){
popupDom.style.display="flex";
alert("请先登记读者姓名与证件号");
return;
}
if(!navigator.geolocation){
alert("你的浏览器不支持定位，请更换浏览器");
return;
}
let btn = this;
btn.disabled=true;
btn.innerText="正在获取位置，请稍候...";

navigator.geolocation.getCurrentPosition(
function(pos){
btn.disabled=false;
btn.innerText="签到进入阅览室";
let currLat = pos.coords.latitude;
let currLng = pos.coords.longitude;
let accuracy = pos.coords.accuracy;
let dist = getDistance(currLat,currLng,TARGET_LAT,TARGET_LNG);

let msg = `当前位置精度：${accuracy.toFixed(1)}米\n距离阅览室：${dist.toFixed(0)}米`;
if(dist <= ALLOW_RADIUS){
alert(msg + "\n✅位置校验通过，打卡成功！\n姓名："+userInfo.name+"\n证件号："+userInfo.sid);
}else{
alert(msg + "\n❌超出40米有效打卡范围，打卡无效！请移步阅览室，建议连接馆内WiFi！");
}
},
function(err){
btn.disabled=false;
btn.innerText="签到进入阅览室";
let errMsg;
switch(err.code){
case 1: errMsg="定位被拒绝，请在浏览器设置允许该网站位置权限！";break;
case 2: errMsg="无法获取位置信号，室内务必连接阅览室WiFi";break;
case 3: errMsg="定位超时，请重试";break;
default:errMsg="定位异常";
}
alert(errMsg);
},
{enableHighAccuracy:true,timeout:12000,maximumAge:0}
);
}

document.getElementById("btnGift").onclick=function(){
alert("礼品兑换功能");
}

//我的页面初始化
if(userInfo){
document.getElementById("myInfo").innerHTML = `<p>姓名：${userInfo.name}</p><p>学号/证件号：${userInfo.sid}</p>`;
}
</script>
</body>
</html>
